<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intervall">
<meta name="theme-color" content="#1c1c1c">
<title>Intervall</title>
<style>
:root{--bg:#1c1c1c;--card:rgba(255,255,255,.07);--petrol:#008787;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:36px 22px 40px}
h1{font-size:14px;letter-spacing:6px;color:var(--petrol);text-align:center;font-weight:600;margin:0 0 28px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
.lbl{font-size:14px;opacity:.6;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:var(--petrol);color:#fff;font-size:26px;line-height:1}
input[type=number]{width:90px;background:none;border:0;color:#fff;font-size:36px;font-weight:300;text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus{outline:none}
.u{opacity:.6;font-size:16px;margin-left:6px}
.val{display:flex;align-items:baseline}
.tg{display:flex;justify-content:space-between;align-items:center}
.sw{position:relative;width:52px;height:30px;background:#555;border-radius:15px;border:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--petrol)}.sw.on::after{left:25px}
.main{width:100%;padding:18px;border:0;border-radius:16px;background:var(--petrol);color:#fff;font-size:20px;font-weight:700;letter-spacing:4px;margin-top:8px}
.ghost{padding:12px 32px;background:none;border:1.5px solid var(--petrol);color:#fff;border-radius:12px;font-size:16px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;gap:28px;text-align:center}
.hide{display:none!important}
.ring{position:relative;width:280px;height:280px}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:200;font-variant-numeric:tabular-nums}
#ph{font-size:28px;font-weight:700;letter-spacing:8px}
#cnt{opacity:.6}
#flash{position:fixed;inset:0;background:var(--petrol);opacity:0;pointer-events:none;transition:opacity .5s}
h2{font-size:32px;margin:0;line-height:1.25}
</style>
</head>
<body>
<div id="flash"></div>

<div class="wrap" id="s1">
  <h1>INTERVALL</h1>
  <div class="card"><div class="lbl">Intervalle</div>
    <div class="row"><button class="rb" data-t="n" data-d="-1">−</button>
    <div class="val"><input id="n" type="number" inputmode="numeric" value="8"><span class="u">×</span></div>
    <button class="rb" data-t="n" data-d="1">+</button></div></div>
  <div class="card"><div class="lbl">Intervall-Dauer</div>
    <div class="row"><button class="rb" data-t="w" data-d="-5">−</button>
    <div class="val"><input id="w" type="number" inputmode="numeric" value="30"><span class="u">Sek</span></div>
    <button class="rb" data-t="w" data-d="5">+</button></div></div>
  <div class="card tg"><span>Pause zwischen Intervallen</span><button class="sw on" id="sw" aria-label="Pause"></button></div>
  <div class="card" id="pc"><div class="lbl">Pausen-Dauer</div>
    <div class="row"><button class="rb" data-t="p" data-d="-5">−</button>
    <div class="val"><input id="p" type="number" inputmode="numeric" value="10"><span class="u">Sek</span></div>
    <button class="rb" data-t="p" data-d="5">+</button></div></div>
  <button class="main" id="go">START</button>
</div>

<div class="wrap hide" id="s2"><div class="center">
  <div id="cnt"></div><div id="ph"></div>
  <div class="ring"><svg width="280" height="280" viewBox="0 0 280 280">
    <circle cx="140" cy="140" r="128" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
    <circle id="arc" cx="140" cy="140" r="128" fill="none" stroke="#008787" stroke-width="14" stroke-linecap="round" stroke-dasharray="804.2" stroke-dashoffset="804.2"/></svg>
    <div class="t" id="tm">0:00</div></div>
  <button class="ghost" id="stop">Abbrechen</button>
</div></div>

<div class="wrap hide" id="s3"><div class="center">
  <h2>Gut gemacht,<br>You’re a badass 🙌🏻</h2>
  <button class="main" id="done" style="width:auto;padding:14px 48px;font-size:18px">FERTIG</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
let pause=true,ph=[],i=0,end=0,dur=0,timer=null,ac=null,wl=null;
const R={n:[1,99],w:[1,3600],p:[1,3600]};
document.querySelectorAll('.rb').forEach(b=>b.onclick=()=>{
  const k=b.dataset.t,el=$(k),v=(parseInt(el.value)||0)+parseInt(b.dataset.d);
  el.value=Math.min(R[k][1],Math.max(R[k][0],v));});
Object.keys(R).forEach(k=>$(k).addEventListener('change',()=>{
  const v=parseInt($(k).value)||R[k][0];$(k).value=Math.min(R[k][1],Math.max(R[k][0],v));}));
$('sw').onclick=()=>{pause=!pause;$('sw').classList.toggle('on',pause);$('pc').classList.toggle('hide',!pause);};
function show(id){['s1','s2','s3'].forEach(x=>$(x).classList.toggle('hide',x!==id));}
function beep(f,len,at=0){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  const t=ac.currentTime+at;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+len);o.start(t);o.stop(t+len+.02);}
function cue(work){
  try{navigator.vibrate&&navigator.vibrate(work?[200]:[100,80,100]);}catch(e){}
  beep(work?880:520,.25);
  const f=$('flash');f.style.transition='none';f.style.opacity=.5;
  requestAnimationFrame(()=>{f.style.transition='opacity .6s';f.style.opacity=0;});}
async function lock(on){try{if(on&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null;}}catch(e){}}
$('go').onclick=()=>{
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}
  const n=Math.max(1,parseInt($('n').value)||1),w=Math.max(1,parseInt($('w').value)||1),p=Math.max(1,parseInt($('p').value)||1);
  ph=[];for(let k=1;k<=n;k++){ph.push({work:1,d:w,r:k,n});if(pause&&k<n)ph.push({work:0,d:p,r:k,n});}
  i=0;show('s2');lock(true);begin();timer=setInterval(tick,100);};
function begin(){
  const x=ph[i];dur=x.d;end=Date.now()+dur*1000;
  $('cnt').textContent='Intervall '+x.r+' / '+x.n;
  $('ph').textContent=x.work?'LOS':'PAUSE';$('ph').style.color=x.work?'#008787':'rgba(255,255,255,.7)';
  $('arc').style.stroke=x.work?'#008787':'rgba(255,255,255,.5)';cue(x.work);}
function tick(){
  const rem=(end-Date.now())/1000;
  if(rem<=0){i++;if(i>=ph.length)return finish();return begin();}
  const s=Math.ceil(rem);$('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('arc').style.strokeDashoffset=804.2*(1-(1-rem/dur));}
function finish(){
  clearInterval(timer);lock(false);show('s3');
  [0,.3,.6].forEach(t=>beep(988,.2,t));try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400]);}catch(e){}}
$('stop').onclick=()=>{clearInterval(timer);lock(false);show('s1');};
$('done').onclick=()=>show('s1');
</script>
</body>
</html>
