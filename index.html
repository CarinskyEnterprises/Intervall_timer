<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intervall">
<meta name="theme-color" content="#1c1c1c">
<title>Intervall</title>
<style>
:root{--bg:#1c1c1c;--card:rgba(255,255,255,.07);--petrol:#008787;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:28px 18px 24px}
h1{font-size:14px;letter-spacing:6px;color:var(--petrol);text-align:center;font-weight:600;margin:0 0 22px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px}
.lbl{font-size:15px;opacity:.65;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rb{width:72px;height:72px;flex:none;border-radius:22px;border:0;background:var(--petrol);color:#fff;font-size:38px;font-weight:300;line-height:1}
.rb:active{transform:scale(.93);background:#00a0a0}
.val{display:flex;align-items:baseline;justify-content:center;flex:1;min-width:0}
input[type=number]{width:110px;background:none;border:0;color:#fff;font-size:52px;font-weight:300;text-align:center;-moz-appearance:textfield;-webkit-user-select:text;user-select:text;padding:0}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus{outline:none;border-bottom:2px solid var(--petrol)}
.u{opacity:.6;font-size:17px;margin-left:2px}
.hint{text-align:center;font-size:14px;opacity:.5;height:18px;margin-top:2px}
.chips{display:flex;gap:8px;margin-top:12px}
.chip{flex:1;padding:12px 0;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:none;color:#fff;font-size:16px}
.chip.on{background:var(--petrol);border-color:var(--petrol)}
.tg{display:flex;justify-content:space-between;align-items:center;font-size:17px;min-height:56px}
.sw{position:relative;width:64px;height:38px;flex:none;background:#555;border-radius:19px;border:0;transition:.2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:30px;height:30px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--petrol)}.sw.on::after{left:30px}
.total{text-align:center;opacity:.6;font-size:15px;margin:6px 0 10px}
.bar{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
.main{width:100%;padding:24px;border:0;border-radius:20px;background:var(--petrol);color:#fff;font-size:24px;font-weight:700;letter-spacing:5px}
.main:active{transform:scale(.98);background:#00a0a0}
.ghost{flex:1;padding:20px 0;background:none;border:1.5px solid var(--petrol);color:#fff;border-radius:18px;font-size:18px}
.ghost.fill{background:var(--petrol)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88vh;gap:24px;text-align:center}
.btns{display:flex;gap:12px;width:100%}
.hide{display:none!important}
.ring{position:relative;width:min(300px,80vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:200;font-variant-numeric:tabular-nums}
#ph{font-size:32px;font-weight:700;letter-spacing:8px}
#cnt{opacity:.6;font-size:18px}
#flash{position:fixed;inset:0;background:var(--petrol);opacity:0;pointer-events:none}
h2{font-size:32px;margin:0;line-height:1.25;white-space:pre-line}
.head{position:relative}
.gear{position:absolute;right:0;top:-8px;width:44px;height:44px;border:0;border-radius:14px;background:var(--card);color:#fff;display:flex;align-items:center;justify-content:center}
.gear:active{background:rgba(255,255,255,.15)}
.gear svg{width:22px;height:22px}
#set{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#set .sheet{width:100%;max-width:460px;background:#262626;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#set .st{font-size:18px;font-weight:600;margin-bottom:14px;text-align:center}
#set .card{background:var(--card)}
.sub{font-size:13px;opacity:.5;margin:-4px 0 10px}
#set .sheet{max-height:90vh;overflow-y:auto}
.pchips{display:flex;gap:4px;overflow-x:auto;background:rgba(0,0,0,.35);border-radius:16px;padding:4px;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.pch{flex:none;padding:12px 18px;border-radius:12px;border:0;background:none;color:rgba(255,255,255,.65);font-size:16px;font-weight:600;white-space:nowrap}
.pch.on{background:var(--petrol);color:#fff}
.pch.del{color:#ff8a8a;box-shadow:inset 0 0 0 1.5px rgba(255,120,120,.55)}
.pch.del::after{content:" ×"}
.ghost.skip{flex:none;width:100%;padding:14px 0;font-size:16px;opacity:.85}
.inv{visibility:hidden}
.plinks{display:flex;gap:20px;margin-top:12px}
.lnk{background:none;border:0;color:#2bb5b5;font-size:15px;padding:6px 0}
.prow{display:flex;gap:8px;margin-top:12px}
.prow input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:0;border-radius:12px;color:#fff;font-size:16px;padding:12px;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div id="flash"></div>

<div class="wrap" id="s1">
  <div class="head"><h1>INTERVALL</h1>
  <button class="gear" id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>

  <div class="card"><div class="lbl">Modes</div>
    <div class="pchips" id="pl"></div>
    <div class="plinks"><button class="lnk" id="psave">Als Mode speichern</button><button class="lnk" id="pedit">Löschen</button></div>
    <div class="prow hide" id="pnrow"><input id="pn" type="text" maxlength="24" placeholder="Name des Modes" enterkeyhint="done"><button class="chip on" id="pok" style="flex:none;padding:12px 20px">OK</button></div>
  </div>

  <div class="card"><div class="lbl">Intervalle</div>
    <div class="row"><button class="rb" data-t="n" data-d="-1">−</button>
    <div class="val"><input id="n" type="number" inputmode="numeric" enterkeyhint="done" value="8"><span class="u">×</span></div>
    <button class="rb" data-t="n" data-d="1">+</button></div>
    <div class="chips" data-t="n"><button class="chip" data-v="4">4</button><button class="chip" data-v="6">6</button><button class="chip" data-v="8">8</button><button class="chip" data-v="10">10</button><button class="chip" data-v="12">12</button></div>
  </div>

  <div class="card"><div class="lbl">Intervall-Dauer</div>
    <div class="row"><button class="rb" data-t="w" data-d="-5">−</button>
    <div class="val"><input id="w" type="number" inputmode="numeric" enterkeyhint="done" value="20"><span class="u">Sek</span></div>
    <button class="rb" data-t="w" data-d="5">+</button></div>
    <div class="hint" id="hw"></div>
    <div class="chips" data-t="w"><button class="chip" data-v="15">15</button><button class="chip" data-v="20">20</button><button class="chip" data-v="30">30</button><button class="chip" data-v="45">45</button><button class="chip" data-v="60">60</button></div>
  </div>

  <div class="card tg"><span>Pause zwischen Intervallen</span><button class="sw on" id="sw" aria-label="Pause"></button></div>

  <div class="card" id="pc"><div class="lbl">Pausen-Dauer</div>
    <div class="row"><button class="rb" data-t="p" data-d="-5">−</button>
    <div class="val"><input id="p" type="number" inputmode="numeric" enterkeyhint="done" value="10"><span class="u">Sek</span></div>
    <button class="rb" data-t="p" data-d="5">+</button></div>
    <div class="hint" id="hp"></div>
    <div class="chips" data-t="p"><button class="chip" data-v="5">5</button><button class="chip" data-v="10">10</button><button class="chip" data-v="15">15</button><button class="chip" data-v="20">20</button><button class="chip" data-v="30">30</button></div>
  </div>

  <div class="card tg"><span>Mehrere Runden</span><button class="sw" id="sw2" aria-label="Runden"></button></div>

  <div class="card hide" id="rn"><div class="lbl">Runden</div>
    <div class="row"><button class="rb" data-t="r" data-d="-1">−</button>
    <div class="val"><input id="r" type="number" inputmode="numeric" enterkeyhint="done" value="1"><span class="u">×</span></div>
    <button class="rb" data-t="r" data-d="1">+</button></div>
    <div class="chips" data-t="r"><button class="chip" data-v="1">1</button><button class="chip" data-v="2">2</button><button class="chip" data-v="3">3</button><button class="chip" data-v="4">4</button><button class="chip" data-v="5">5</button></div>
  </div>

  <div class="card hide" id="rc"><div class="lbl">Pause zwischen Runden</div>
    <div class="row"><button class="rb" data-t="rp" data-d="-5">−</button>
    <div class="val"><input id="rp" type="number" inputmode="numeric" enterkeyhint="done" value="60"><span class="u">Sek</span></div>
    <button class="rb" data-t="rp" data-d="5">+</button></div>
    <div class="hint" id="hrp"></div>
    <div class="chips" data-t="rp"><button class="chip" data-v="30">30</button><button class="chip" data-v="45">45</button><button class="chip" data-v="60">60</button><button class="chip" data-v="90">90</button><button class="chip" data-v="120">120</button></div>
  </div>

  <div class="total" id="tot"></div>
  <div class="bar"><button class="main" id="go">START</button></div>
</div>

<div id="set" class="hide"><div class="sheet">
  <div class="st">Einstellungen</div>
  <div class="card"><div class="lbl">Countdown vor dem Start</div>
    <div class="row"><button class="rb" data-t="cd" data-d="-1">−</button>
    <div class="val"><input id="cd" type="number" inputmode="numeric" enterkeyhint="done" value="10"><span class="u">Sek</span></div>
    <button class="rb" data-t="cd" data-d="1">+</button></div>
    <div class="hint" id="hcd"></div>
    <div class="chips" data-t="cd"><button class="chip" data-v="0">Aus</button><button class="chip" data-v="5">5</button><button class="chip" data-v="10">10</button><button class="chip" data-v="15">15</button><button class="chip" data-v="20">20</button></div>
  </div>
  <div class="card tg"><span>Ton</span><button class="sw on" id="o_snd" aria-label="Ton"></button></div>
  <div class="card tg"><span>Vibration</span><button class="sw on" id="o_vib" aria-label="Vibration"></button></div>
  <div class="card tg"><span>Blitz</span><button class="sw on" id="o_fl" aria-label="Blitz"></button></div>
  <button class="main" id="setok">FERTIG</button>
</div></div>

<div class="wrap hide" id="s2"><div class="center">
  <div id="cnt"></div><div id="ph"></div>
  <div class="ring"><svg viewBox="0 0 280 280">
    <circle cx="140" cy="140" r="128" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
    <circle id="arc" cx="140" cy="140" r="128" fill="none" stroke="#008787" stroke-width="14" stroke-linecap="round" stroke-dasharray="804.2" stroke-dashoffset="804.2"/></svg>
    <div class="t" id="tm">0:00</div></div>
  <button class="ghost skip inv" id="skip">Pause überspringen</button>
  <div class="btns"><button class="ghost" id="stop">Abbrechen</button><button class="ghost fill" id="pz">Anhalten</button></div>
</div></div>

<div class="wrap hide" id="s3"><div class="center">
  <h2 id="msg">Gut gemacht,
You’re a badass 🙌🏻</h2>
  <button class="main" id="done">FERTIG</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
let rOn=false,pause=true,ph=[],i=0,end=0,dur=0,timer=null,ac=null,wl=null,paused=false,remMs=0;
const R={n:[1,99],w:[1,3600],p:[1,3600],r:[1,20],rp:[1,3600],cd:[0,60]};
const val=k=>Math.min(R[k][1],Math.max(R[k][0],parseInt($(k).value)||R[k][0]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function refresh(){
  ['w','p','rp'].forEach(k=>{const v=parseInt($(k).value)||0;$('h'+k).textContent=v>=60?'= '+fmt(v)+' Min':'';});
  $('hcd').textContent=(parseInt($('cd').value)||0)===0?'Kein Countdown – es geht sofort los':'';
  document.querySelectorAll('.chips').forEach(c=>{const v=parseInt($(c.dataset.t).value);
    c.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.v)===v));});
  const n=val('n'),w=val('w'),p=val('p'),r=rOn?val('r'):1,rp=val('rp');
  $('rn').classList.toggle('hide',!rOn);
  if(typeof presets!=='undefined'&&presets){const c={n,w,p,pause:pause?1:0,rOn:rOn?1:0,r,rp:val('rp')};
    [...$('pl').children].forEach((b,j)=>b.classList.toggle('on',!pEdit&&!!presets[j]&&same(presets[j],c)));}
  $('rc').classList.toggle('hide',!rOn||r<2);
  const t=r*(n*w+(pause?(n-1)*p:0))+(r-1)*(rp+(pause?p:0));$('tot').textContent='Gesamtdauer: '+fmt(t)+' Min'+(r>1?' ('+r+' Runden)':'');saveLast();}
function setV(k,v){$(k).value=Math.min(R[k][1],Math.max(R[k][0],v));refresh();if(k==='cd')try{localStorage.setItem('cd',$('cd').value);}catch(e){}}
// Halten = schnelles Hoch-/Runterzählen
document.querySelectorAll('.rb').forEach(b=>{
  let to=null,iv=null;const k=b.dataset.t,d=parseInt(b.dataset.d);
  const step=()=>setV(k,(parseInt($(k).value)||0)+d);
  const stop=()=>{clearTimeout(to);clearInterval(iv);};
  b.addEventListener('pointerdown',e=>{e.preventDefault();step();to=setTimeout(()=>{iv=setInterval(step,80);},450);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('contextmenu',e=>e.preventDefault());});
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setV(b.parentElement.dataset.t,parseInt(b.dataset.v)));
Object.keys(R).forEach(k=>{
  $(k).addEventListener('focus',()=>setTimeout(()=>$(k).select(),30));
  $(k).addEventListener('input',refresh);
  $(k).addEventListener('change',()=>setV(k,val(k)));
  $(k).addEventListener('keydown',e=>{if(e.key==='Enter')$(k).blur();});});
function setPause(on){pause=on;$('sw').classList.toggle('on',on);$('pc').classList.toggle('hide',!on);refresh();}
$('sw').onclick=()=>setPause(!pause);
try{const c=localStorage.getItem('cd');if(c!==null&&!isNaN(parseInt(c)))$('cd').value=Math.min(60,Math.max(0,parseInt(c)));}catch(e){}
$('gear').onclick=()=>$('set').classList.remove('hide');
$('setok').onclick=()=>{setV('cd',val('cd'));$('set').classList.add('hide');};
$('set').addEventListener('click',e=>{if(e.target===$('set'))$('setok').onclick();});
function setRounds(on){rOn=on;$('sw2').classList.toggle('on',on);refresh();}
$('sw2').onclick=()=>setRounds(!rOn);

// Optionen Ton / Vibration / Blitz
let opt={snd:true,vib:true,fl:true};
try{const o=JSON.parse(localStorage.getItem('opt'));if(o)opt={...opt,...o};}catch(e){}
['snd','vib','fl'].forEach(k=>{const b=$('o_'+k);b.classList.toggle('on',opt[k]);
  b.onclick=()=>{opt[k]=!opt[k];b.classList.toggle('on',opt[k]);try{localStorage.setItem('opt',JSON.stringify(opt));}catch(e){}};});
const vib=pt=>{if(opt.vib)try{navigator.vibrate&&navigator.vibrate(pt);}catch(e){}};

// Voreinstellungen
const DEF=[{name:'Tabata',n:8,w:20,p:10,pause:1,rOn:0,r:1,rp:60},{name:'On/Off',n:10,w:60,p:60,pause:1,rOn:0,r:1,rp:60},{name:'EMOM',n:10,w:60,p:10,pause:0,rOn:0,r:1,rp:60}];
let presets=null,pEdit=false;
try{presets=JSON.parse(localStorage.getItem('modes'));}catch(e){}
if(!Array.isArray(presets)){
  presets=DEF.map(x=>({...x}));
  try{const old=JSON.parse(localStorage.getItem('presets'));
    if(Array.isArray(old))old.filter(x=>x&&!['Tabata','10 × 1 Min'].includes(x.name)).forEach(x=>presets.push(x));}catch(e){}}
const savePs=()=>{try{localStorage.setItem('modes',JSON.stringify(presets));}catch(e){}};
const cur=()=>({n:val('n'),w:val('w'),p:val('p'),pause:pause?1:0,rOn:rOn?1:0,r:val('r'),rp:val('rp')});
const same=(a,b)=>a.n===b.n&&a.w===b.w&&a.pause===b.pause&&(!a.pause||a.p===b.p)&&a.rOn===b.rOn&&(!a.rOn||(a.r===b.r&&a.rp===b.rp));
function applyP(x){setV('n',x.n);setV('w',x.w);setV('p',x.p);setV('r',x.r);setV('rp',x.rp);setPause(!!x.pause);setRounds(!!x.rOn);}
function renderP(){
  const pl=$('pl');pl.textContent='';
  presets.forEach((x,j)=>{const b=document.createElement('button');b.className='pch'+(pEdit?' del':'');b.textContent=x.name;
    b.onclick=()=>{if(pEdit){presets.splice(j,1);savePs();renderP();}else applyP(x);};pl.appendChild(b);});
  $('pedit').textContent=pEdit?'Fertig':'Löschen';refresh();}
$('psave').onclick=()=>{pEdit=false;renderP();const r=$('pnrow');r.classList.toggle('hide');if(!r.classList.contains('hide')){$('pn').value='';$('pn').focus();}};
function okP(){const name=$('pn').value.trim();if(!name)return;
  const x={name,...cur()},j=presets.findIndex(q=>q.name===name);
  if(j>=0)presets[j]=x;else presets.push(x);
  savePs();$('pn').blur();$('pnrow').classList.add('hide');renderP();}
$('pok').onclick=okP;
$('pn').addEventListener('keydown',e=>{if(e.key==='Enter')okP();});
$('pedit').onclick=()=>{pEdit=!pEdit;$('pnrow').classList.add('hide');renderP();};
// Letzte Einstellung als Start merken
const saveLast=()=>{try{localStorage.setItem('last',JSON.stringify(cur()));}catch(e){}};
try{const l=JSON.parse(localStorage.getItem('last'));
  if(l&&['n','w','p','r','rp'].every(k=>typeof l[k]==='number'))applyP(l);}catch(e){}
function show(id){['s1','s2','s3'].forEach(x=>$(x).classList.toggle('hide',x!==id));window.scrollTo(0,0);}
function beep(f,len,at=0,vol=.5){
  if(!ac||!opt.snd)return;const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  const t=ac.currentTime+at;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+len);o.start(t);o.stop(t+len+.02);}
function cue(work){
  vib(work?[200]:[100,80,100]);
  beep(work?880:520,.25);
  if(!opt.fl)return;
  const f=$('flash');f.style.transition='none';f.style.opacity=.5;
  requestAnimationFrame(()=>{f.style.transition='opacity .6s';f.style.opacity=0;});}
async function lock(on){try{if(on&&navigator.wakeLock)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null;}}catch(e){}}
$('go').onclick=()=>{
  document.activeElement&&document.activeElement.blur();
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();}catch(e){}
  const n=val('n'),w=val('w'),p=val('p'),R_=rOn?val('r'):1,rp=val('rp'),cd=val('cd');
  ph=[];if(cd>0)ph.push({t:'pre',d:cd});
  for(let q=1;q<=R_;q++){for(let k=1;k<=n;k++){
    ph.push({t:'work',d:w,q,k,n,R:R_});
    if(k<n){if(pause)ph.push({t:'rest',d:p,q,k,n,R:R_});}
    else if(q<R_){if(pause)ph.push({t:'rest',d:p,q,k,n,R:R_});ph.push({t:'rpause',d:rp,q,k,n,R:R_});}}}
  i=0;paused=false;$('pz').textContent='Anhalten';show('s2');lock(true);begin();clearInterval(timer);timer=setInterval(tick,100);};
let lastSec=-1;
function begin(){
  const x=ph[i];dur=x.d;end=Date.now()+dur*1000;lastSec=-1;
  const work=x.t==='work';
  $('skip').classList.toggle('inv',work);$('skip').textContent=x.t==='pre'?'Countdown überspringen':'Pause überspringen';
  if(x.t==='pre'){$('cnt').textContent='Mach dich bereit';$('ph').textContent='START IN';}
  else{
    const rt=x.R>1?'Runde '+x.q+' / '+x.R+' · ':'';
    $('cnt').textContent=x.t==='rpause'?'Runde '+x.q+' / '+x.R+' geschafft · lange Pause':rt+'Intervall '+x.k+' / '+x.n;
    $('ph').textContent=work?'LOS':'PAUSE';}
  $('ph').style.color=work?'#008787':'rgba(255,255,255,.7)';
  $('arc').style.stroke=work?'#008787':'rgba(255,255,255,.5)';
  if(x.t!=='pre')cue(work);}
function tick(){
  if(paused)return;
  const rem=(end-Date.now())/1000;
  if(rem<=0){i++;if(i>=ph.length)return finish();return begin();}
  const sec=Math.ceil(rem);
  if(sec<=3&&sec!==lastSec){lastSec=sec;
    if(ph[i].t==='pre'){beep(660,.12);vib(40);}
    else if(dur>3)beep(660,.1,0,.2);}
  $('tm').textContent=fmt(sec);
  $('arc').style.strokeDashoffset=804.2*(rem/dur);}
const MSGS=["Gut gemacht,\nYou’re a badass 🙌🏻","Boom. Erledigt.\nDu Maschine 💥","Schweiß ist nur Fett, das weint 😤","Dein Sofa vermisst dich schon.\nEgal, du hast geliefert 🛋️","Beast Mode:\nabgeschlossen 🦍","Dein zukünftiges Ich sagt Danke 🙏🏻","Heute schon besser als gestern 📈","Kein Excuse,\nnur Ergebnisse 🔥","Legendär.\nEinfach legendär 🏆","Du hast den inneren Schweinehund besiegt 🐷","Wasser trinken nicht vergessen, Champ 💧","Mehr davon, bitte.\nNächstes Mal wieder 😎","Stark. Wie ein Schrank,\nnur beweglicher 💪🏻","Das war nicht schlecht.\nDas war richtig gut 👏🏻"];
let lastMsg=-1;
function finish(){
  clearInterval(timer);lock(false);
  let m;do{m=Math.floor(Math.random()*MSGS.length);}while(m===lastMsg);
  lastMsg=m;$('msg').textContent=MSGS[m];show('s3');
  [0,.3,.6].forEach(t=>beep(988,.2,t));vib([200,100,200,100,400]);}
$('skip').onclick=()=>{if(paused){paused=false;$('pz').textContent='Anhalten';}i++;if(i>=ph.length)return finish();begin();};
$('pz').onclick=()=>{
  if(!paused){paused=true;remMs=end-Date.now();$('pz').textContent='Weiter';}
  else{paused=false;end=Date.now()+remMs;$('pz').textContent='Anhalten';}};
$('stop').onclick=()=>{clearInterval(timer);lock(false);show('s1');};
$('done').onclick=()=>show('s1');
renderP();
</script>
